spring:
  #  config:
  #    import: sensitive-regex.yml
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  datasource:
    # Use MySQL running in Docker (see docker-compose.yml). Host maps to localhost:3307 -> container 3306
    url: jdbc:mysql://localhost:3307/employee-mangement?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: employeemangement
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    # Dev convenience: if applied migration files differ from recorded checksums, clean and re-run migrations.
    # WARNING: destructive — removes all data in the configured database. Use only in development.
    clean-on-validation-error: true
    clean-disabled: false

  h2:
    console.enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  health:
    elasticsearch:
      enabled: false
    vault:
      enabled: false
