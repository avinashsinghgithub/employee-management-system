  <div class="container">
    <div class="raw">
      <div class="col-lg-6 col-md-6 col-sm-6 container justify-content-center card">
        <h1 class="text-center">Add New Employee</h1>
        <div class="card-body">
          <form th:action = "@{/employees}" th:object="${employee}" method="POST">
            <div class="form-group">
              <label>Employee First Name</label>
              <input type="text" name="firstName" th:field="*{firstName}" class="form-control" placeholder="Enter Employee First Name">
            </div>
            <div class="form-group">
              <label>Employee First Name</label>
              <input type="text" name="lastName" th:field="*{lastName}" class="form-control" placeholder="Enter Employee Last Name">
            </div>
            <div class="form-group">
              <label>Joining Date</label>
              <input type="date" name="joiningDate" th:field="*{joiningDate}" class="form-control">
            </div>
            <div class="form-group">
              <label>Employee Email</label>
              <input type="email" name="email" th:field="*{email}" class="form-control" placeholder="Enter Employee Email Address">
            </div>
            <div class="form-group">
              <label>Employee Type</label>
              <input type="text" name="employeeType" th:field="*{employeeType}" class="form-control" placeholder="Enter Employee Type">
            </div>
            <div class="box-footer">
              <button type="submit" class="btn btn-primary">Submit</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
